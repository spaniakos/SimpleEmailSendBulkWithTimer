name: Resolve Laravel 13 Composer Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, dom, filter, hash, mbstring, openssl, pdo, tokenizer, xml
          coverage: none
      - name: Resolve the Laravel 13 runtime and test dependency graph
        run: composer update laravel/framework laravel/tinker phpunit/phpunit --with-all-dependencies --no-interaction --prefer-dist --no-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: laravel-13-composer-lock
          path: composer.lock
          if-no-files-found: error
