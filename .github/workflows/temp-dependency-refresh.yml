name: Temporary dependency refresh
on:
  push:
    branches: [chore/dependency-lock-refresh]
permissions:
  contents: read
jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Update only packages reported by the Composer audit
        run: composer update guzzlehttp/guzzle guzzlehttp/psr7 laravel/framework league/commonmark league/flysystem phpunit/phpunit psy/psysh symfony/http-foundation symfony/http-kernel symfony/mailer symfony/mime symfony/polyfill-intl-idn symfony/process symfony/routing symfony/yaml --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Audit refreshed dependency graph
        run: composer audit --locked --no-interaction
      - name: Emit compressed lockfile for maintainer review
        run: |
          printf 'LOCKFILE_GZIP_BASE64_BEGIN\n'
          gzip -c composer.lock | base64 -w0
          printf '\nLOCKFILE_GZIP_BASE64_END\n'
